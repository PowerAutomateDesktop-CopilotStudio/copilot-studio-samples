name: Submit a challenge
description: An agent or a workflow you would like Anne to build as a sample.
labels: [sample request]
body:
  - type: textarea
    id: job
    attributes: {label: The job, description: "Who would talk to the agent, about what, and what it should never do."}
    validations: {required: true}
  - type: input
    id: sources
    attributes: {label: Knowledge, tools and systems, description: "e.g. a policy document, SharePoint, Dataverse, an API, a desktop flow"}
